<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock Exam – Chess Arbiter</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ── Header ────────────────────────────────────────────────────────────── -->
<header class="site-header">
  <div class="header-inner">
    <div class="site-logo"><a href="index.html" style="color:#fff;text-decoration:none"><strong>Chess Arbiter</strong></a></div>
    <button class="nav-toggle" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="manual.html">Manual</a>
      <a href="exam.html" class="active">Mock Exam</a>
      <a href="search.html">Search</a>
      <a href="feedback.html">Feedback</a>
    </nav>
  </div>
</header>

<!-- ── Exam Selector (shown when no file param) ──────────────────────────── -->
<section class="section" id="exam-selector" style="display:none;">
  <div class="container" style="max-width:700px;">
    <div class="section-header">
      <h2>Choose an Exam</h2>
      <p>Select a chapter exam or take the full exam covering all topics.</p>
    </div>
    <div class="card-grid" id="exam-options">
      <div class="loading-wrap"><div class="spinner"></div></div>
    </div>
  </div>
</section>

<!-- ── Exam Area ─────────────────────────────────────────────────────────── -->
<main class="container" style="max-width:720px;padding-top:36px;padding-bottom:60px;">
  <div id="exam-title-row" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;">
    <h1 id="exam-title" style="font-size:1.4rem;"></h1>
    <a href="index.html" class="btn btn-secondary btn-sm">← Back to Home</a>
  </div>
  <div id="exam-wrap">
    <div class="loading-wrap"><div class="spinner"></div><p>Loading exam…</p></div>
  </div>
</main>

<!-- ── Footer ────────────────────────────────────────────────────────────── -->
<footer class="site-footer">
  <p>Chess Arbiter Study Portal &mdash; Not an official FIDE publication.</p>
</footer>

<script src="js/app.js"></script>
<script>
// If no file param → show exam selector
(async function() {
  const params = new URLSearchParams(location.search);
  if (!params.get('file')) {
    document.getElementById('exam-selector').style.display = 'block';
    document.querySelector('main').style.display = 'none';

    const { fetchJSON, escHtml } = window.FideApp;
    const index = await fetchJSON('data/index.json');
    const grid  = document.getElementById('exam-options');

    // ── Chapter exams ──
    const chapterItems = index.chapters.map(ch => ({
      type:  'internal',
      title: `Chapter ${ch.id}: ${ch.title}`,
      desc:  `Chapter-specific exam — ${ch.description}`,
      file:  ch.exam
    }));

    // ── Full Mock Exam sets ──
    const fullExamSets = [
      {
        type:   'external',
        set:    'Set 1',
        title:  'Full Mock Exam — Set 1',
        desc:   'Comprehensive exam covering all chapters. Opens in a new tab.',
        url:    'https://share.gemini.google/iFvTOXoz09Ur'
      },
      {
        type:   'internal',
        set:    'Set 2',
        title:  'Full Mock Exam — Set 2 (25 Questions)',
        desc:   '25 questions covering all 12 chapters — comprehensive arbiter exam practice.',
        file:   index.fullExam.file
      },
      {
        type:   'internal',
        set:    'Set 3',
        title:  'Full Exam-Laws of Chess CH 1-12',
        desc:   'Full exam covering Laws of Chess — Articles 1 to 12.',
        file:   'data/exams/exam-full_Laws_Of_Chess.json'
      },
      {
        type:   'page',
        set:    'FA Exam',
        title:  'FIDE Arbiter (FA) Exam Paper',
        desc:   'Official style 39-question subjective examination with written answers and PDF report export.',
        pageUrl:'fa-exam.html'
      }
    ];

    // ── Render chapter cards ──
    const chapterHtml = chapterItems.map(item => `
      <div class="chapter-card">
        <h3>${escHtml(item.title)}</h3>
        <p>${escHtml(item.desc)}</p>
        <a href="exam.html?file=${encodeURIComponent(item.file)}&title=${encodeURIComponent(item.title)}"
           class="btn btn-primary btn-sm" style="margin-top:8px;">Start Exam →</a>
      </div>
    `).join('');

    // ── Render Full Mock Exam section ──
    const fullExamHtml = `
      <div style="grid-column:1/-1;margin-top:8px;">
        <h3 style="font-size:1rem;font-weight:600;margin-bottom:16px;padding-bottom:10px;
                   border-bottom:2px solid var(--accent);color:var(--accent);">
          📝 Full Mock Exam
        </h3>
        <div class="card-grid" style="margin-top:0;">
          ${fullExamSets.map((set, i) => `
            <div class="chapter-card" style="border-left:4px solid var(--accent);">
              <div style="font-size:.75rem;font-weight:700;text-transform:uppercase;
                          letter-spacing:.8px;color:var(--accent);margin-bottom:6px;">
                ${escHtml(set.set)}
              </div>
              <h3 style="font-size:.95rem;">${escHtml(set.title)}</h3>
              <p>${escHtml(set.desc)}</p>
              ${set.type === 'external'
                ? `<a href="${set.url}" target="_blank" rel="noopener"
                      class="btn btn-primary btn-sm" style="margin-top:8px;">
                     Start Exam ↗
                   </a>`
                : set.type === 'page'
                ? `<a href="${set.pageUrl}"
                      class="btn btn-primary btn-sm" style="margin-top:8px;">
                     Start Exam →
                   </a>`
                : `<a href="exam.html?file=${encodeURIComponent(set.file)}&title=${encodeURIComponent(set.title)}"
                      class="btn btn-primary btn-sm" style="margin-top:8px;">
                     Start Exam →
                   </a>`
              }
            </div>
          `).join('')}
        </div>
      </div>`;

    grid.innerHTML = chapterHtml + fullExamHtml;
  }
})();
</script>
<script src="js/exam.js"></script>

</body>
</html>
