<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Results – FIDE Arbiter's Manual</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ── Header ────────────────────────────────────────────────────────────── -->
<header class="site-header">
  <div class="header-inner">
    <div class="site-logo"><a href="index.html" style="color:#fff;text-decoration:none">FIDE <span>Arbiter's Manual</span></a></div>
    <button class="nav-toggle" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="manual.html">Manual</a>
      <a href="exam.html" class="active">Mock Exam</a>
      <a href="search.html">Search</a>
      <a href="feedback.html">Feedback</a>
    </nav>
  </div>
</header>

<!-- ── Results ───────────────────────────────────────────────────────────── -->
<main class="container" style="max-width:720px;padding-top:36px;padding-bottom:60px;">
  <div id="results-wrap">
    <div class="loading-wrap"><div class="spinner"></div><p>Calculating results…</p></div>
  </div>
</main>

<!-- ── Footer ────────────────────────────────────────────────────────────── -->
<footer class="site-footer">
  <p>FIDE Arbiter's Manual Study Portal &mdash; Not an official FIDE publication.</p>
</footer>

<script src="js/app.js"></script>
<script>
(function() {
  const { loadExamState, escHtml } = window.FideApp;
  const wrap = document.getElementById('results-wrap');

  const data = loadExamState('examResult');
  if (!data) {
    wrap.innerHTML = `
      <div class="card" style="text-align:center;padding:40px">
        <h2 style="margin-bottom:12px">No Results Found</h2>
        <p style="color:var(--muted);margin-bottom:20px">Please complete an exam first.</p>
        <a href="exam.html" class="btn btn-primary">Take an Exam</a>
      </div>`;
    return;
  }

  const { title, questions, answers, timeTaken } = data;
  const total   = questions.length;
  let   correct = 0;

  questions.forEach(q => {
    if (answers[q.id] === q.correct) correct++;
  });

  const score    = Math.round((correct / total) * 100);
  const passed   = score >= 75;  // 75% pass mark
  const mins     = Math.floor(timeTaken / 60);
  const secs     = timeTaken % 60;
  const timeStr  = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;

  // ── Summary ──
  wrap.innerHTML = `
    <div class="card" style="margin-bottom:28px;">
      <div class="result-summary">
        <div class="score-circle ${passed ? 'score-pass' : 'score-fail'}">${score}%</div>
        <h2 style="margin-bottom:8px;">${passed ? '🎉 Passed!' : '📚 Keep Studying'}</h2>
        <p style="color:var(--muted);">${title}</p>
        <div style="display:flex;gap:24px;justify-content:center;margin-top:20px;flex-wrap:wrap;">
          <div style="text-align:center;">
            <div style="font-size:1.6rem;font-weight:700;color:var(--success)">${correct}</div>
            <div style="font-size:.82rem;color:var(--muted);">Correct</div>
          </div>
          <div style="text-align:center;">
            <div style="font-size:1.6rem;font-weight:700;color:var(--danger)">${total - correct}</div>
            <div style="font-size:.82rem;color:var(--muted);">Incorrect</div>
          </div>
          <div style="text-align:center;">
            <div style="font-size:1.6rem;font-weight:700;color:var(--accent)">${total}</div>
            <div style="font-size:.82rem;color:var(--muted);">Total</div>
          </div>
          <div style="text-align:center;">
            <div style="font-size:1.6rem;font-weight:700;color:var(--text)">${timeStr}</div>
            <div style="font-size:.82rem;color:var(--muted);">Time Taken</div>
          </div>
        </div>
        <p style="font-size:.85rem;color:var(--muted);margin-top:16px;">
          Pass mark: 75% &mdash; You scored ${score}%
          ${passed ? '✅ Well done!' : '— Aim for 75% or higher'}
        </p>
      </div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:4px;">
        <a href="exam.html" class="btn btn-primary">Retake Exam</a>
        <a href="manual.html" class="btn btn-secondary">Review Manual</a>
        <a href="index.html" class="btn btn-secondary">Home</a>
      </div>
    </div>

    <!-- Detailed breakdown -->
    <div class="result-breakdown">
      <h3 style="margin-bottom:16px;">Question Breakdown</h3>
      ${questions.map((q, i) => {
        const chosen    = answers[q.id];
        const isCorrect = chosen === q.correct;
        const chosenOpt = q.options.find(o => o.id === chosen);
        const correctOpt= q.options.find(o => o.id === q.correct);

        return `
          <div class="result-item ${isCorrect ? 'correct' : 'wrong'}">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
              <span style="font-size:1.1rem;">${isCorrect ? '✅' : '❌'}</span>
              <span style="font-size:.8rem;color:var(--muted)">Q${i + 1} &middot; Article ${escHtml(q.article)} &middot; <span class="badge badge-${q.difficulty}">${q.difficulty}</span></span>
            </div>
            <p style="font-weight:600;margin-bottom:10px;">${escHtml(q.text)}</p>
            ${!isCorrect ? `
              <p style="font-size:.88rem;color:var(--danger);margin-bottom:4px;">
                Your answer: <strong>${chosenOpt ? escHtml(chosenOpt.text) : 'Not answered'}</strong>
              </p>
              <p style="font-size:.88rem;color:var(--success);margin-bottom:10px;">
                Correct answer: <strong>${correctOpt ? escHtml(correctOpt.text) : ''}</strong>
              </p>
            ` : `
              <p style="font-size:.88rem;color:var(--success);margin-bottom:10px;">
                Your answer: <strong>${chosenOpt ? escHtml(chosenOpt.text) : ''}</strong> ✓
              </p>
            `}
            <div class="explanation-box">
              <strong>Explanation</strong>
              ${escHtml(q.explanation)}
            </div>
          </div>`;
      }).join('')}
    </div>`;
})();
</script>

</body>
</html>
