<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manual – Chess Arbiter</title>
  <link rel="stylesheet" href="css/style.css?v=3">
  <style>
    /* ── Reading pane overrides ─────────────────────────────── */
    .reader-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 28px;
      align-items: start;
      margin-top: 0;
    }

    /* Sidebar */
    .reader-sidebar {
      position: sticky;
      top: 76px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      max-height: calc(100vh - 100px);
      display: flex;
      flex-direction: column;
    }
    .reader-sidebar-head {
      padding: 12px 16px;
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .reader-sidebar-body {
      overflow-y: auto;
      flex: 1;
    }
    .reader-sidebar-body a {
      display: block;
      padding: 9px 16px;
      font-size: .85rem;
      color: var(--text);
      border-left: 3px solid transparent;
      line-height: 1.35;
      transition: background .1s, border-color .1s;
    }
    .reader-sidebar-body a:hover {
      background: var(--accent-lt);
      color: var(--accent);
      text-decoration: none;
    }
    .reader-sidebar-body a.active {
      background: var(--accent-lt);
      color: var(--accent);
      border-left-color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }
    .reader-sidebar-body a .ch-num {
      display: block;
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--muted);
      margin-bottom: 1px;
    }
    .reader-sidebar-body a.active .ch-num { color: var(--accent); }

    /* Content pane */
    .reader-content {
      min-width: 0;
    }
    .reader-chapter-banner {
      background: linear-gradient(135deg, #1d4a8f 0%, #2a6fbd 100%);
      color: #fff;
      border-radius: var(--radius);
      padding: 28px 32px;
      margin-bottom: 28px;
    }
    .reader-chapter-banner .ch-label {
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      opacity: .8;
      margin-bottom: 6px;
    }
    .reader-chapter-banner h2 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 16px;
      line-height: 1.3;
    }

    /* Article cards */
    .article-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 28px;
      margin-bottom: 16px;
      border-left: 4px solid var(--border);
      transition: border-left-color .2s;
    }
    .article-card:hover {
      border-left-color: var(--accent);
    }
    .article-card .art-tag {
      display: inline-block;
      background: var(--accent-lt);
      color: var(--accent);
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
      padding: 3px 9px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .article-card h3 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text);
    }
    .article-card .art-body {
      font-size: .95rem;
      line-height: 1.8;
      color: #3a4049;
    }
    .article-card .art-body p { margin-bottom: .75em; }
    .article-card .art-body p:last-child { margin-bottom: 0; }

    @media (max-width: 700px) {
      .reader-layout { grid-template-columns: 1fr; }
      .reader-sidebar { position: static; max-height: none; }
      .reader-chapter-banner { padding: 20px; }
      .article-card { padding: 18px 16px; }
    }
  </style>
</head>
<body>

<!-- ── Header ────────────────────────────────────────────────────────────── -->
<header class="site-header">
  <div class="header-inner">
    <div class="site-logo">
      <a href="index.html" style="color:#fff;text-decoration:none"><strong>Chess Arbiter</strong></a>
    </div>
    <button class="nav-toggle" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="manual.html" class="active">Manual</a>
      <a href="exam.html">Mock Exam</a>
      <a href="search.html">Search</a>
      <a href="feedback.html">Feedback</a>
    </nav>
  </div>
</header>

<!-- ── Page ──────────────────────────────────────────────────────────────── -->
<main class="container" style="padding-top:28px;padding-bottom:60px;max-width:1060px;">

  <div style="display:flex;align-items:center;justify-content:space-between;
              margin-bottom:24px;flex-wrap:wrap;gap:10px;">
    <div>
      <h1 style="font-size:1.3rem;font-weight:700;">
        <strong>Chess Arbiter</strong> &mdash; Manual 2025
      </h1>
      <p style="color:var(--muted);font-size:.85rem;margin-top:4px;">
        FIDE Arbiter&rsquo;s Manual · All chapters
      </p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <a href="search.html" class="btn btn-secondary btn-sm">🔍 Search Articles</a>
      <a href="data/Arbiters_Manual_2025.pdf" target="_blank" rel="noopener"
         class="btn btn-secondary btn-sm">Open PDF ↗</a>
      <a href="data/Arbiters_Manual_2025.pdf" download class="btn btn-primary btn-sm">Download PDF ↓</a>
    </div>
  </div>

  <div class="reader-layout">

    <!-- ── Sidebar ── -->
    <nav class="reader-sidebar" id="chapter-sidebar">
      <div class="reader-sidebar-head">Chapters</div>
      <div class="reader-sidebar-body" id="sidebar-links">
        <div class="loading-wrap" style="padding:20px;"><div class="spinner"></div></div>
      </div>
    </nav>

    <!-- ── Content ── -->
    <div class="reader-content" id="chapter-content">
      <div class="loading-wrap"><div class="spinner"></div><p>Loading…</p></div>
    </div>

  </div>
</main>

<!-- ── Footer ────────────────────────────────────────────────────────────── -->
<footer class="site-footer">
  <p>Chess Arbiter Study Portal &mdash; Not an official FIDE publication.</p>
</footer>

<script>
// ── Helpers ────────────────────────────────────────────────────────────────
const sidebarLinks = document.getElementById('sidebar-links');
const content      = document.getElementById('chapter-content');

document.querySelector('.nav-toggle').addEventListener('click', () => {
  document.querySelector('.nav-links').classList.toggle('open');
});

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatContent(s) {
  // Escape, then restore paragraph and line-break structure
  return escHtml(s)
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>');
}

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status + ' — ' + url);
  return r.json();
}

// ── Load & render a chapter ────────────────────────────────────────────────
async function loadChapter(file, examFile) {
  content.innerHTML = '<div class="loading-wrap"><div class="spinner"></div><p>Loading chapter…</p></div>';
  const ch = await fetchJSON(file);

  const articlesHtml = ch.articles.map(art => `
    <div class="article-card" id="art-${art.article.replace(/\./g,'-')}">
      <span class="art-tag">Article ${escHtml(art.article)}</span>
      <h3>${escHtml(art.heading)}</h3>
      <div class="art-body"><p>${formatContent(art.content)}</p></div>
    </div>
  `).join('');

  content.innerHTML = `
    <div class="reader-chapter-banner">
      <div class="ch-label">Chapter ${escHtml(String(ch.chapter))}</div>
      <h2>${escHtml(ch.title)}</h2>
      <a href="exam.html?file=${encodeURIComponent(examFile)}&title=${encodeURIComponent(ch.title)}"
         class="btn btn-white btn-sm">✏️ Take Chapter ${escHtml(String(ch.chapter))} Exam →</a>
    </div>
    ${articlesHtml}
    <p style="margin-top:8px;text-align:right;">
      <a href="exam.html?file=${encodeURIComponent(examFile)}&title=${encodeURIComponent(ch.title)}"
         class="btn btn-primary btn-sm">✏️ Take Chapter Exam →</a>
    </p>
  `;
}

// ── Init ───────────────────────────────────────────────────────────────────
async function init() {
  const index = await fetchJSON('data/index.json');

  // Build sidebar
  sidebarLinks.innerHTML = index.chapters.map(ch => `
    <a href="#" data-file="${ch.file}" data-exam="${ch.exam}" data-id="${ch.id}">
      <span class="ch-num">Chapter ${ch.id}</span>${escHtml(ch.title)}
    </a>
  `).join('');

  // Determine which chapter to open: ?chapter=N param, else first
  const params     = new URLSearchParams(location.search);
  const chParam    = parseInt(params.get('chapter'), 10);
  const allLinks   = Array.from(sidebarLinks.querySelectorAll('a[data-file]'));
  const targetLink = (chParam && allLinks.find(a => parseInt(a.dataset.id) === chParam))
                     || allLinks[0];

  function activateLink(link) {
    allLinks.forEach(a => a.classList.remove('active'));
    link.classList.add('active');
    // Keep it in view in sidebar
    link.scrollIntoView({ block: 'nearest' });
  }

  if (targetLink) {
    activateLink(targetLink);
    await loadChapter(targetLink.dataset.file, targetLink.dataset.exam);
  }

  // Sidebar click handler
  sidebarLinks.addEventListener('click', async function(e) {
    const link = e.target.closest('a[data-file]');
    if (!link) return;
    e.preventDefault();
    activateLink(link);
    // Update URL without reload
    history.replaceState(null, '', '?chapter=' + link.dataset.id);
    await loadChapter(link.dataset.file, link.dataset.exam).catch(showError);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

function showError(err) {
  content.innerHTML = `
    <div style="padding:28px;color:var(--danger);border:1px solid var(--danger-lt);
                background:var(--danger-lt);border-radius:var(--radius);">
      <strong>Error loading chapter:</strong> ${escHtml(err.message)}<br><br>
      <small>Make sure you are running via a local server
             (<code>python start-server.py</code>), not by opening the file directly.</small>
    </div>`;
}

init().catch(showError);
</script>

</body>
</html>
